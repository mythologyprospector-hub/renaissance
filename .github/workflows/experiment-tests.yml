name: Renaissance experiment tests

on:
  push:
    branches: [main]
    paths:
      - "experiments/**"
      - "runtime/**"
      - ".github/workflows/experiment-tests.yml"
  pull_request:
    paths:
      - "experiments/**"
      - "runtime/**"
      - ".github/workflows/experiment-tests.yml"
  workflow_dispatch:

jobs:
  relationship-interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run relationship interoperability prototype tests
        working-directory: experiments
        run: python -m unittest -v test_relationship_interoperability.py test_builder_grounding.py test_relationship_protocol_design.py test_relationship_protocol_extensions.py test_relationship_protocol_lineage.py test_relationship_protocol_translation.py test_relationship_protocol_identity.py test_relationship_protocol_versioning.py test_relationship_protocol_transport.py test_relationship_protocol_security.py test_relationship_requirement_scope.py test_relationship_boundary_conformance.py test_human_doorway_harness.py

  human-doorway-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install fastapi pytest
      - name: Run Human Doorway runtime tests
        working-directory: runtime/human_doorway
        run: python -m pytest -q
