name: Renaissance grounding snapshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grounding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Generate grounding snapshot
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "# Renaissance — Grounding Snapshot"
            echo
            echo "> Generated orientation material. This file is not canon."
            echo
            echo "**Source commit:** $(git rev-parse HEAD)"
            echo "**Branch:** $(git branch --show-current)"
            echo
            echo "## Recent commits"
            echo
            git log -8 --date=short --pretty=format:'- %h %ad %s'
            echo
            echo
            echo "## Core documents"
            echo
            for f in STATUS.md CHARTER.md CONSTITUTION.md PRINCIPLES.md BOUNDARIES.md EPISTEMOLOGY.md GOVERNANCE.md CHANGE_CONTROL.md ARCHITECTURE.md AGENTS.md ONBOARDING_PROMPT.md; do
              if [ -f "$f" ]; then
                printf -- '- `%s` — present\\n' "$f"
              else
                printf -- '- `%s` — MISSING\\n' "$f"
              fi
            done
            echo
            echo "## Decision records"
            echo
            if [ -d DECISIONS ]; then
              find DECISIONS -maxdepth 1 -type f -name '*.md' -printf '%f\\n' | sort | sed 's/^/- /'
            else
              echo "- DECISIONS directory missing"
            fi
            echo
            echo "## Working tree"
            echo
            if git diff --quiet -- . ':(exclude)GROUNDING_SNAPSHOT.md' && git diff --cached --quiet -- . ':(exclude)GROUNDING_SNAPSHOT.md'; then
              echo "Clean before snapshot generation."
            else
              echo "Repository contains uncommitted changes before snapshot generation."
            fi
          } > GROUNDING_SNAPSHOT.md

      - name: Commit snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- GROUNDING_SNAPSHOT.md && git diff --cached --quiet -- GROUNDING_SNAPSHOT.md && git ls-files --error-unmatch GROUNDING_SNAPSHOT.md >/dev/null 2>&1; then
            echo "Grounding snapshot unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f GROUNDING_SNAPSHOT.md
          git commit -m "chore: refresh grounding snapshot"
          git push
